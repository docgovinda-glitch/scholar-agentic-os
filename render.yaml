# Scholar Agentic OS Deployment Configuration
# Primary hosting stack (Task 9 decision, 2026-08-02):
# - Render: Full-stack hosting (frontend + backend, Docker deployment)
# - Supabase: User authentication and database (profiles, admin approvals)
# - Resend: Transactional emails (approval/reset notifications)
# - Cloudflare: DNS management
#
# Serves:
# - AI generation routes (/api/generate*, /api/stream-generate)
# - Parse/parsing routes (/api/parse-file, /api/parse-external-link, /api/lookup-doi)
# - Agent execution routes (/api/agents, /api/agents/execute)
# - Admin approval UI (/admin/approve-scholar)
# - Health check endpoint (/api/health)
#
# Auth/user/admin data: Supabase (not local Postgres)
# Email delivery: Resend Edge Functions (not server.ts)
#
# VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, and VITE_CAPTCHA_SITE_KEY are consumed
# as Docker build ARGs by the Dockerfile (Render automatically forwards matching env
# vars as build args), not just runtime env — required for Vite to bake them into the
# built frontend bundle.
services:
  - type: web
    name: scholar-agentic-os
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    # `free`, not `starter`. This file previously declared `starter`, which is
    # Render's PAID ($7/mo) always-on plan — it contradicted the stated
    # free-tier-only constraint, and a blueprint sync would have silently
    # provisioned a billable service.
    #
    # What the free plan actually imposes, and what the code now assumes:
    #   * spins down after ~15 min idle; the next request pays a cold start
    #     (tens of seconds for a Docker service) — see src/services/
    #     serverWarmup.ts, which probes /api/health at app boot so the
    #     container wakes while the user is still reading the page, and
    #     reports "waking" honestly instead of surfacing a generic failure
    #   * 512 MB RAM — MAX_UPLOAD_MB in server.ts is sized against this
    #   * 750 instance-hours/month across all free services in the account
    plan: free
    # Gives Render a readiness signal, and gives the warmup probe a cheap,
    # dependency-free endpoint to hit.
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      # Caps the JSON/urlencoded/multipart upload size server.ts and multer will
      # buffer. Default 10 MB is chosen for the free plan's 512 MB ceiling
      # alongside the 1-at-a-time heavy-parse concurrency guard.
      - key: MAX_UPLOAD_MB
        value: 10
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_BACKUP
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Wraps every Premium-pool provider credential (Section 10 of the AI
      # Access architecture) — see .env.example's "Scholar AI Engine"
      # section and supabase/schema_ai_engine.sql for the full reasoning.
      # Distinct from ENCRYPTION_KEY above (a legacy, unrelated key).
      - key: MASTER_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_CAPTCHA_SITE_KEY
        sync: false
      # Server-side only, verified against Cloudflare's siteverify endpoint by
      # server/src/middleware/captchaVerify.ts — runtime env is sufficient,
      # it never needs to reach the frontend bundle.
      - key: CAPTCHA_SECRET_KEY
        sync: false
      # Server-side only — NEVER prefixed VITE_, or Vite would bake it into the
      # client bundle and hand every visitor a key that bypasses Row Level
      # Security.
      #
      # Undeclared here until now, though FINAL_DEPLOYMENT_PLAN.md and
      # POCKET_DEPLOYMENT.md both instruct setting it by hand in the Render
      # dashboard. That worked, but left the blueprint an incomplete record of
      # what the service needs: a blueprint re-sync or a new environment would
      # come up without it, and requireAuth
      # (server/src/middleware/auth.ts) answers every authenticated request
      # with 500 "Auth service not configured" when it is absent — failing
      # closed, but indistinguishable from an outage.
      #
      # `sync: false` keeps the secret out of the repository; this declares
      # that the service requires it, not what it is.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # OPTIONAL, and no longer the persistence path.
      #
      # Project persistence now runs over Supabase's HTTPS Data API, using
      # VITE_SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY above — the two values
      # this service already needs in order to verify tokens. Nothing else has
      # to be configured for projects to be durable.
      #
      # The direct connection is retained as a fallback (it supports SQL the
      # Data API cannot express), but it failed here four separate ways:
      # db.<ref>.supabase.co is IPv6-only while Render's egress is IPv4-only;
      # the IPv4 pooler needs the right region, port and tenant username;
      # Supabase's cert chains to its own root, so TLS fails without pinning
      # it; and it needs a database password distinct from every other
      # credential. See docs/06-decisions/62-DATABASE-ACCESS.md.
      #
      # Leave unset unless you specifically need direct SQL. If you do set it,
      # use the POOLER host, never db.<ref>.supabase.co.
      - key: DATABASE_URL
        sync: false

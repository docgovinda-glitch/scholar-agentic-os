name: Slide Visual Parity (web ↔ .pptx)

# Renders every Presentation Studio card layout in light and dark themes in
# Chromium, exports the same deck to .pptx, converts it with LibreOffice and
# compares the two. Side-by-side images are uploaded as an artifact.
on:
  pull_request:
    paths:
      - 'src/features/slides/**'
      - 'scripts/slide-parity/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/slide-parity.yml'
  workflow_dispatch:

concurrency:
  group: slide-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Web card vs exported PowerPoint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Install LibreOffice, poppler and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils fonts-liberation
          npx playwright install --with-deps chromium

      # Decks use Georgia for serif text (quotes, editorial themes). Ubuntu has
      # no Georgia, so both Chromium and LibreOffice would fall back to a much
      # wider serif. Gelasio is metric-compatible with Georgia (SIL OFL).
      - name: Install a Georgia-compatible font
        run: |
          mkdir -p ~/.fonts ~/.config/fontconfig
          for spec in "0,400" "0,700" "1,400" "1,700"; do
            url=$(curl -fsS "https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@${spec}" | grep -o 'https://[^)]*\.ttf' | head -1)
            curl -fsSL -o ~/.fonts/"Gelasio-${spec/,/-}.ttf" "$url"
          done
          cat > ~/.config/fontconfig/fonts.conf <<'XML'
          <?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig><alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family></prefer></alias></fontconfig>
          XML
          fc-cache -f
          fc-match Georgia

      - name: Start dev server
        run: |
          PORT=3000 npm run dev > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then echo "server up"; exit 0; fi
            sleep 2
          done
          echo "dev server did not start"; cat dev-server.log; exit 1

      - name: Compare web cards with exported .pptx
        run: node scripts/slide-parity/run.mjs --base http://localhost:3000 --out artifacts/slide-parity

      - name: Upload side-by-side images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slide-parity
          path: artifacts/slide-parity
          if-no-files-found: ignore
          retention-days: 14

name: Uptime check

# Free uptime monitor: every 15 minutes, check the live site and its database
# path. A failed run makes GitHub email the repository owner.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health?deep=1
        run: |
          # Free Render instances sleep when idle; allow a cold start.
          for attempt in 1 2 3; do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 90 'https://scholar.gkshah.com.np/api/health?deep=1' || true)
            if [ "$code" = "200" ]; then cat body.json; echo; exit 0; fi
            echo "attempt $attempt: HTTP $code"; sleep 20
          done
          cat body.json 2>/dev/null || true
          exit 1

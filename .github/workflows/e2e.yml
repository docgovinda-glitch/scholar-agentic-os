name: E2E

# Browser tests (Playwright) against a local Supabase built from the repo's
# schemas and migrations. Never touches production.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_A_EMAIL: e2e-a@example.test
      E2E_A_PASSWORD: E2e-local-only-A-1234
      E2E_B_EMAIL: e2e-b@example.test
      E2E_B_PASSWORD: E2e-local-only-B-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          HUSKY: '0'
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: |
          mkdir -p "$RUNNER_TEMP/supa" && cd "$RUNNER_TEMP/supa"
          supabase init --force >/dev/null
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' | sed 's/"//g' >> "$GITHUB_ENV"
      - name: Build the database from the repo
        run: scripts/db/replay-migrations.sh "$DB_URL"
      - name: Credit balance and ledger stay in step
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/db/test-credits.sql
      - name: Create E2E test accounts
        run: node scripts/e2e-setup.mjs
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
      - name: Start the stand-in AI service
        run: nohup node e2e/stub-ai/server.mjs > stub-ai.log 2>&1 &
      - name: Start the app
        run: |
          PORT=3000 NODE_ENV=development \
          VITE_SUPABASE_URL="$API_URL" SUPABASE_URL="$API_URL" \
          VITE_SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          LLM_CHALLENGE_SECRET="ci-local-only" MASTER_KEY="$(openssl rand -hex 32)" \
          nohup npm run dev > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then echo "server up"; exit 0; fi
            sleep 2
          done
          cat dev-server.log; exit 1
      - name: Run E2E tests
        run: npx playwright test
        env:
          E2E_STUB_AI_URL: http://localhost:1234
      - name: Production smoke suite against the local stack
        run: node scripts/smoke-prod.mjs --setup --base http://localhost:3000
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          SMOKE_A_EMAIL: smoke-a@example.test
          SMOKE_A_PASSWORD: Smoke-local-only-A-1234
          SMOKE_B_EMAIL: smoke-b@example.test
          SMOKE_B_PASSWORD: Smoke-local-only-B-1234
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            artifacts/e2e-report
            artifacts/e2e-results
            dev-server.log
            stub-ai.log
          if-no-files-found: ignore
          retention-days: 14

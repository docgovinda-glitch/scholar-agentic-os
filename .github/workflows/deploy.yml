name: Production Deployment & Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript & Design Compliance Lint
        run: npm run lint

      - name: Dependency audit (production deps, high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Run Test Suite
        run: npm test

      - name: Compile Client & Server Production Bundles
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "⚠️ VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY not set in repository secrets; using placeholder build values for CI bundle verification."
            export VITE_SUPABASE_URL="https://ci-placeholder.supabase.co"
            export VITE_SUPABASE_ANON_KEY="ci-placeholder-anon-key"
          fi
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy to Production
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://scholar.gkshah.com.np
    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}
        run: |
          if [ -n "$RENDER_DEPLOY_KEY" ]; then
            echo "🚀 Triggering Render deploy hook for service srv-d9lgbn710e5c73dl8sk0..."
            curl --fail --silent --show-error --request POST \
              --url "https://api.render.com/deploy/srv-d9lgbn710e5c73dl8sk0?key=${RENDER_DEPLOY_KEY}" \
              --header 'accept: application/json'
            echo "✅ Render deployment hook triggered successfully."
          else
            echo "ℹ️ RENDER_DEPLOY_KEY not set in GitHub repository secrets."
            echo "ℹ️ Render native Git integration autoDeploy is enabled via render.yaml."
          fi

      - name: Wait until the new commit is live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            live=$(curl -s --max-time 60 https://scholar.gkshah.com.np/api/health | jq -r '.commit // empty' || true)
            if [ "$live" = "$want" ]; then echo "Live commit $live"; exit 0; fi
            # Render builds the newest main, so a later merge can replace this
            # commit before it is ever reported. A live commit that already
            # contains this one also proves this change is deployed.
            if [ -n "$live" ]; then
              rel=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$live" --jq .status 2>/dev/null || true)
              if [ "$rel" = "ahead" ]; then echo "Live commit $live already contains $want"; exit 0; fi
            fi
            echo "live=${live:-unknown} want=$want (attempt $i)"; sleep 20
          done
          echo "::error::Render did not report commit $want within 20 minutes"
          exit 1

      - name: Deep health check
        run: curl -f -s --max-time 60 'https://scholar.gkshah.com.np/api/health?deep=1'

      - name: Checkout smoke suite
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Production smoke suite
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SMOKE_SUPABASE_SERVICE_ROLE_KEY }}
          SMOKE_A_EMAIL: ${{ secrets.SMOKE_A_EMAIL }}
          SMOKE_A_PASSWORD: ${{ secrets.SMOKE_A_PASSWORD }}
          SMOKE_B_EMAIL: ${{ secrets.SMOKE_B_EMAIL }}
          SMOKE_B_PASSWORD: ${{ secrets.SMOKE_B_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SMOKE_A_EMAIL" ]; then
            echo "::warning::Smoke secrets not set (SMOKE_SUPABASE_SERVICE_ROLE_KEY, SMOKE_A/B_EMAIL/PASSWORD); skipping the smoke suite."
            exit 0
          fi
          node scripts/smoke-prod.mjs

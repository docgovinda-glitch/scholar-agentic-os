name: CI

# Same quality gates as the production deploy, run on every pull request so
# problems are caught before merge (deploy.yml re-runs them on main).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint (tsc, contrast, CSP hash)
        run: npm run lint
      - name: Dependency audit (production deps, high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

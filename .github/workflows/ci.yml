name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          CLIENT_SIZE=$(stat -c%s dist/index.html 2>/dev/null || echo "0")
          SERVER_SIZE=$(stat -c%s dist/server.cjs 2>/dev/null || echo "0")
          echo "Client bundle: $(($CLIENT_SIZE / 1024)) KB"
          echo "Server bundle: $(($SERVER_SIZE / 1024)) KB"
          if [ "$SERVER_SIZE" -gt 400000 ]; then
            echo "⚠️ Server bundle exceeds 400KB"
          fi

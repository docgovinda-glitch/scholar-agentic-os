<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale=1.0, user-scalable=no` removed: it blocked pinch-zoom
         entirely, which fails WCAG 2.1 SC 1.4.4 (Resize Text) and is a real
         barrier for low-vision users on the phone — the surface where this
         product expects reading and approving to happen. iOS's zoom-on-focus
         behaviour, the usual reason people reach for `user-scalable=no`, is
         handled properly in src/index.css instead, by keeping focused inputs
         at a 16px font size. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scholar Agentic OS</title>

    <!-- Matches the browser chrome to the app surface in both themes.
         Values are --surface-canvas from src/index.css. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F5F0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191816" />

    <!-- Typography: Plus Jakarta Sans, Inter & Manrope for warm, modern Airbnb-inspired typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Resolve an explicit theme choice before first paint.
         The stylesheet already follows `prefers-color-scheme`, so this matters
         only when the user has overridden that: without it, someone who chose
         dark on a light-default system sees a white flash on every load.
         Inline and synchronous by necessity — a deferred script runs after
         first paint, which is precisely the flash being avoided. Wrapped in
         try/catch because localStorage throws in Safari private mode. -->
    <script>
      try {
        var t = localStorage.getItem('scholar-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>

    <!-- Web App / PWA Support -->
    <!-- Standard replacement for the deprecated apple-mobile-web-app-capable -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Keep the Apple-prefixed version for iOS Safari standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ScholarAgentic" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

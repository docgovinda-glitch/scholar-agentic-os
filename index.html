<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale=1.0, user-scalable=no` removed: it blocked pinch-zoom
         entirely, which fails WCAG 2.1 SC 1.4.4 (Resize Text) and is a real
         barrier for low-vision users on the phone — the surface where this
         product expects reading and approving to happen. iOS's zoom-on-focus
         behaviour, the usual reason people reach for `user-scalable=no`, is
         handled properly in src/index.css instead, by keeping focused inputs
         at a 16px font size. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scholar Agentic OS</title>

    <!-- Matches the browser chrome to the app surface in dark theme. -->
    <meta name="theme-color" content="#171717" />

    <!-- Typography: Plus Jakarta Sans, Inter & Manrope for warm, modern Airbnb-inspired typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Theme pre-paint hydration -->
    <script>
      try {
        var t = localStorage.getItem('scholar-theme') || localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.add('dark');
      }
    </script>

    <!-- Web App / PWA Support -->
    <!-- Standard replacement for the deprecated apple-mobile-web-app-capable -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Keep the Apple-prefixed version for iOS Safari standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScholarAgentic" />
  </head>
  <body class="bg-[#171717] text-neutral-200 antialiased" style="background-color: #171717; color: #e5e5e5;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
